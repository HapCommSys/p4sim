# Builds the Docker image of P4sim with the oldest and the newest ns-3 release
# it supports, and runs all of its test suites and examples in each
# (contrib/p4sim/test/run-tests.sh).
name: Docker build and tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        ns3: [ns-3.39, ns-3.49]
    name: test (${{ matrix.ns3 }})
    steps:
      - uses: actions/checkout@v5

      # The image needs about 7 GB; these preinstalled SDKs are not used
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Build the image
        run: docker build --build-arg NS3_VERSION=${{ matrix.ns3 }} -t p4sim:ci .

      - name: Run the tests
        run: docker run --rm p4sim:ci contrib/p4sim/test/run-tests.sh
