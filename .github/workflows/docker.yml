# Builds the Docker image of P4sim and runs all of its test suites and
# examples in it (contrib/p4sim/test/run-tests.sh).
name: Docker build and tests

on:
  push:
    branches: [main, switch_channel]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      # The image needs about 7 GB; these preinstalled SDKs are not used
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Build the image
        run: docker build -t p4sim:ci .

      - name: Run the tests
        run: docker run --rm p4sim:ci contrib/p4sim/test/run-tests.sh
